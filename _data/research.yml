  link_display: ""

- title: "Whole-brain models for simulating TMS-EEG/pupil"
  image: ""
  question: "Can we estimate the changes in the network in the brain before they become too degraded?"
  description: |
    Neurodegenerative diseases (i.e., diseases such as dementia, stroke etc. that are caused due to the degradation of the nervous system) pose a tremendous cost to society. At the core, the origin of these diseases is alterations in the neural (and other related) networks within the brain.

    Today we have to wait for symptoms to appear before we can detect such diseases. Or we have to depend on expensive and inaccessible tools like MRI, which also are able to detect these diseases when they are already quite advanced. *Can we estimate the changes in the network in the brain before they become too degraded?*

    When you hit a tin from the outside, you can tell by the sound whether it is empty or filled; without having to open it. We want to use a similar technique to see if the network inside the brain is intact or degraded -- we hit it from outside with *Transcranial Magnetic Stimulation*, a strong magnetic pulse, and measure the response with *EEG*. Based on the EEG, can we say something substantial about the state of the internal network?

    For doing this TMS-EEG procedure effectively, we are **developing whole brain models** that take the network structure as the input, model the effect of TMS and give realistic EEG as the output. We can then use these models to simulate different TMS paradigms and identify paradigms most effective for detecting small changes in brain connectivity.
  link_url: ""
  link_display: ""

- title: "Whole brain dynamical models"
  image: ""
  question: ""
  description: |
    Broadly, we are interested in developing simple, minimalistic whole-brain models that can still effectively explain experimental data. We collaborate with experimentalists, especially the Allen Institute, to get data for our models. Some of the projects include:

    - Simple models for epilepsy in the mouse brain
    - Modeling neural dynamics in mouse brains under waking and anesthetized conditions
